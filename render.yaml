# Render Blueprint. In Render: New > Blueprint > pick your GitHub repo.
# Check the plan name and price shown at creation time. The disk below needs a PAID instance;
# free web services sleep after 15 min idle and have no persistent disk, which would stop the scanner.
services:
  - type: web
    name: forex-hitl
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    healthCheckPath: /health
    autoDeployTrigger: "off"   # redeploy by hand; a bot that trades should not restart on every commit
    disk:
      name: forex-state
      mountPath: /app/data     # daily-loss baseline + lockout survive restarts and deploys
      sizeGB: 1
    envVars:
      - key: OANDA_ENVIRONMENT
        value: practice
      - key: TRADING_TIME_ZONE
        value: Australia/Melbourne
      - key: TRADING_START
        value: "09:00"
      - key: TRADING_END
        value: "17:00"
      - key: TRADING_DAYS
        value: Monday,Tuesday,Wednesday,Thursday,Friday
      - key: SUPABASE_URL
        sync: false            # optional; set with SUPABASE_SECRET_KEY to use external state
      - key: SUPABASE_SECRET_KEY
        sync: false            # server secret only, never a browser publishable key
      - key: OANDA_API_TOKEN
        sync: false            # Render prompts for these on first creation
      - key: OANDA_ACCOUNT_ID
        sync: false
      - key: APPROVER_PASSWORD
        sync: false            # 12+ characters; this is the only thing protecting the approve button
      - key: NTFY_TOPIC
        sync: false            # optional push notifications; leave blank to skip
      - key: PUBLIC_BASE_URL
        sync: false            # e.g. https://forex-hitl.onrender.com (used as the ntfy tap target)
