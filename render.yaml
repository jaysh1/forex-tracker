# Render Blueprint for the existing forex-tracker service.
# Service settings mirror the current Render deployment; existing environment values are preserved.
services:
  - type: web
    name: forex-tracker
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/jaysh1/forex-tracker.git
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TRADING_TIME_ZONE
        value: Australia/Melbourne
      - key: TRADING_START
        value: "09:00"
      - key: TRADING_END
        value: "17:00"
      - key: TRADING_DAYS
        value: Monday,Tuesday,Wednesday,Thursday,Friday
      - key: SUPABASE_URL
        sync: false            # optional; set with SUPABASE_SECRET_KEY to enable durable state
      - key: SUPABASE_SECRET_KEY
        sync: false            # server secret only; never use a browser publishable key
