# Render Blueprint matching the existing forex-tracker service (free plan).
# Free instances sleep after ~15 min idle: ping /health every 10 min to keep the scanner running.
# State (daily-loss baseline, lockout, activity) is saved to Supabase, so no disk is needed.
services:
  - type: web
    name: forex-tracker
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/jaysh1/forex-tracker.git
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: OANDA_ENVIRONMENT
        value: practice
      - key: OANDA_API_TOKEN
        sync: false
      - key: OANDA_ACCOUNT_ID
        sync: false
      - key: APPROVER_PASSWORD
        sync: false            # 12+ characters; this is the only thing protecting the approve button
      - key: NTFY_TOPIC
        sync: false            # optional push notifications; leave blank to skip
      - key: PUBLIC_BASE_URL
        sync: false            # e.g. https://forex-tracker.onrender.com (used as the ntfy tap target)
      - key: SUPABASE_URL
        sync: false            # https://<ref>.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false            # the sb_secret_... key, never the publishable/anon key
      - key: TRADING_HOURS
        value: 09:00-17:00
      - key: TRADING_DAYS
        value: Mon-Fri
      - key: TRADING_TIMEZONE
        value: Australia/Melbourne
      - key: MAX_RISK_PER_TRADE
        value: "50"
      - key: CFD_INSTRUMENTS
        value: AU200_AUD,SPX500_USD
      - key: CFD_MAX_RISK_PER_TRADE
        value: "50"
      - key: CFD_TRADING_HOURS
        value: always
