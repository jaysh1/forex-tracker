name: .NET validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ForexHitl.Web/package-lock.json
      - run: npm ci
        working-directory: src/ForexHitl.Web
      - run: npm run build
        working-directory: src/ForexHitl.Web
      - run: dotnet test ForexHitl.sln --configuration Release
      - run: dotnet publish src/ForexHitl --configuration Release --output /tmp/forex-server
