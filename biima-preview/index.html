<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIIMA Roadside FNOL Preview</title><style>
:root{font-family:Inter,Arial,sans-serif;background:#edf3f9;color:#183b59}*{box-sizing:border-box}body{margin:0}header{background:#173d65;color:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}main{max-width:680px;margin:20px auto;padding:0 12px}.card{background:#fff;border:1px solid #cbdce8;border-radius:16px;padding:22px;margin-bottom:15px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.choice{background:#fff;border:1.5px solid #c8dbe9;border-radius:12px;padding:16px;text-align:left;color:#194060;cursor:pointer;flex:1;min-width:128px;font-weight:650}.choice.sel{background:#e6f4ff;border:2px solid #167fbe}.primary{background:#087ac0;color:white;border:0;border-radius:10px;padding:14px 18px;font-weight:700;cursor:pointer}.secondary{background:white;color:#185273;border:1px solid #bfcfdd;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer}.danger{background:#b92432;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:700}button:disabled{opacity:.5;cursor:not-allowed}input,textarea{width:100%;padding:12px;border:1px solid #c3d3e1;border-radius:8px;font:inherit;margin:6px 0 14px}textarea{min-height:90px}label{font-weight:650;font-size:13px}.muted{color:#566f82;font-size:14px}.small{font-size:12px}.progress{display:flex;gap:4px;margin:16px 0}.progress i{flex:1;height:6px;background:#d3e1ed;border-radius:8px}.progress i.done{background:#1687cb}.soft{background:#eaf4fb;padding:14px;border-radius:10px}.block{width:100%}.hidden{display:none}.field{margin:10px 0}.status{font-size:12px;color:#1e7449}.section{margin-top:20px;padding-top:10px;border-top:1px solid #d6e4ed}h1{font-size:23px;margin:8px 0 14px}h2{font-size:19px;margin:8px 0 14px}p{line-height:1.5}.details{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin:9px 0}.details b{font-size:13px}.details span{font-size:13px;color:#536b80}@media(max-width:430px){.card{padding:16px}.choice{min-width:120px}.details{grid-template-columns:1fr 1.3fr}} </style></head><body>
<header><strong>🚚 Roadside Report <small style="display:block;font-weight:normal">Supported by BIIMA · DEMO</small></strong><div class="row"><button class="secondary" onclick="showBroker()">Broker demo</button></div></header>
<main id="app"></main>
<script>
const KEY="biima-fnol-demo-v4";const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}})();let data=saved||{id:"DRAFT-"+Math.floor(Date.now()/1000),step:0,created:Date.now(),safe:"",injuries:"",injuryNotes:"",police:false,fire:false,ambulance:false,none:false,incident:"",location:"",when:"",involved:"",people:"",name:"",mobile:"",rego:"",state:"VIC",fleet:"",confirmed:false,photos:0,notes:"",consent:false,submitted:false};let screen=saved&&!saved.submitted?"resume":"driver",online=navigator.onLine,serverAck=false,method="manual",fleet="ABC Transport";const examples=[{fleet:"ABC Transport",rego:"ABC123",name:"John Smith",mobile:"0412 345 678"},{fleet:"ABC Transport",rego:"ABC456",name:"Aman Singh",mobile:"0415 333 444"},{fleet:"XYZ Logistics",rego:"XYZ458",name:"Sarah Kim",mobile:"0413 200 100"}], stages=["Safety","Injuries","Emergency services","Who is involved","Driver details","Photos & notes","Review","Submit"];const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("Local storage unavailable. Do not rely on this demo to retain incident information.")}}function set(k,v){data[k]=v;save();render()}function field(k,label,placeholder="",multiline=false){return '<div class="field"><label>'+label+'</label>'+(multiline?'<textarea oninput="change(\''+k+'\',this.value)">'+esc(data[k])+'</textarea>':'<input value="'+esc(data[k])+'" placeholder="'+esc(placeholder)+'" oninput="change(\''+k+'\',this.value)">')+'</div>'}function change(k,v){data[k]=v;if(["name","mobile","rego"].includes(k))data.confirmed=false;save();}function tiles(k,options){return '<div class="row">'+options.map(o=>'<button class="choice '+(data[k]===o?"sel":"")+'" onclick="set(\''+k+'\',\''+o+'\')">'+esc(o)+'</button>').join("")+'</div>'}function toggle(k,label){return '<button class="choice '+(data[k]?"sel":"")+'" onclick="set(\''+k+'\','+(!data[k])+')">'+(data[k]?"✓ ":"")+label+'</button>'}function progress(){return '<div class="row between"><b>'+stages[data.step]+'</b><span class="muted">Step '+(data.step+1)+' / 8</span></div><div class="progress">'+stages.map((_,i)=>'<i class="'+(i<=data.step?"done":"")+'"></i>').join("")+'</div><p class="status">✓ Saved on this device · '+(online?"Connected — server sync not configured":"Offline — local only")+'</p>'}function buttons(){return '<div class="row">'+(data.step?'<button class="secondary" onclick="back()">Back</button>':"")+(data.step<7?'<button class="primary" style="flex:1" onclick="next()">Continue →</button>':"")+'</div>'}function back(){data.step=Math.max(0,data.step-1);save();render()}function next(){if(data.step===4&&(!data.name.trim()||!data.mobile.trim()||!data.rego.trim()||!data.confirmed)){alert("Enter and confirm driver details first.");return}data.step=Math.min(7,data.step+1);save();render()}function populate(rego){const r=examples.find(x=>x.rego===rego);if(!r)return;Object.assign(data,r,{confirmed:false});method="manual";save();render()}function sms(){const r=examples.find(x=>x.rego===data.rego||x.mobile.replace(/\s/g,"")===data.mobile.replace(/\s/g,""));if(r)populate(r.rego);else alert("No matching demo record. Broker verification is not connected.");}function showBroker(){screen="broker";render()}function showDriver(){screen=data.submitted?"done":"driver";render()}function submit(){if(!data.consent)return;data.submitted=true;save();screen="done";render()}function reset(){localStorage.removeItem(KEY);location.reload()}function val(v){return esc(v||"Not provided")}function pair(a,b){return '<div class="details"><span>'+a+'</span><b>'+val(b)+'</b></div>'}
function render(){const root=document.getElementById("app");let html="";
if(screen==="resume"){html='<section class="card"><div class="muted">UNFINISHED REPORT FOUND</div><h1>Welcome back</h1><p>We found an incident report saved on this device. Resume without starting again.</p><div class="soft"><b>'+esc(data.incident||"Unfinished incident")+'</b><p>'+esc(data.location||"Location not entered")+'</p><p>Saved draft: '+esc(data.id)+' · Step '+(data.step+1)+' of 8</p><p class="status">✓ Local draft available · Server sync is not enabled in this demo</p></div><p><button class="primary block" onclick="screen=\'driver\';render()">Resume this report →</button></p><button class="secondary block" onclick="screen=\'saved\';render()">Review saved details</button><p><button class="secondary block" onclick="if(confirm(\'Delete current demonstration draft and start new?\'))reset()">Start a new report</button></p></section>'}
else if(screen==="saved"){html='<section class="card"><h1>Saved incident</h1>'+pair("Safety",data.safe)+pair("Injuries",data.injuries)+pair("Emergency services",[data.police&&"Police",data.fire&&"Fire",data.ambulance&&"Ambulance"].filter(Boolean).join(", "))+pair("Incident",data.incident)+pair("Location",data.location)+pair("Driver",data.name)+'<button class="primary block" onclick="screen=\'driver\';render()">Continue editing →</button></section>'}
else if(screen==="broker"){html='<section class="card"><h1>BIIMA Broker · Demo</h1><p class="muted">Read-only demonstration of the draft visible on this device. Real admin login and server-side records are not enabled here.</p>'+pair("Draft",data.id)+pair("Status",data.submitted?"Submitted demo":"Unsubmitted local draft")+pair("Driver",data.name)+pair("Vehicle",data.rego)+pair("Fleet",data.fleet)+pair("Accident",data.incident)+pair("Location",data.location)+pair("Injuries",data.injuries)+pair("People",data.people)+pair("Photos",data.photos)+pair("Notes",data.notes)+'<button class="secondary block" onclick="showDriver()">Back to driver</button></section>'}
else if(screen==="done"){html='<section class="card"><h1>✓ Demonstration complete</h1><p>No data was sent to BIIMA. This preview does not have a backend acknowledgement, so the local demo record is retained.</p><button class="secondary block" onclick="reset()">Clear local demo and start again</button></section>'}
else {html='<section class="card">'+progress();switch(data.step){
case 0:html+='<h1>Are you safe right now?</h1>'+tiles("safe",["I am safe","I need help"])+'<div class="soft section">If someone is in immediate danger, call emergency services.</div><p><a href="tel:000"><button class="danger block">☎ Dial 000</button></a></p>';break;
case 1:html+='<h1>Is anyone injured?</h1>'+tiles("injuries",["No injuries","Yes, injuries","Unsure"])+field("injuryNotes","Injury details (optional)","",true);break;
case 2:html+='<h1>Emergency services required?</h1><div class="row">'+toggle("police","Police")+toggle("fire","Fire brigade")+toggle("ambulance","Ambulance")+toggle("none","None required")+'</div><p><a href="tel:000"><button class="danger block">Dial 000</button></a></p>';break;
case 3:html+='<h1>Who is involved?</h1><p class="muted">What happened?</p>'+tiles("incident",["Collision","Vehicle damage","Cargo damage","Breakdown","Other"])+field("location","Location","Road, suburb, landmark")+field("when","Date / time","Approximate date and time")+'<label>Other people or vehicles?</label>'+tiles("involved",["Yes","No","Unsure"])+field("people","Other drivers / witnesses","",true);break;
case 4:html+='<h1>Driver and vehicle details</h1><p>Enter manually or use a simulated QR or broker SMS match.</p><div class="row">'+["manual","qr","sms"].map(m=>'<button class="choice '+(method===m?"sel":"")+'" onclick="method=\''+m+'\';render()">'+({manual:"✎ Manual",qr:"▦ Scan QR",sms:"✉ SMS broker"}[m])+'</button>').join("")+'</div>';if(method==="qr")html+='<div class="soft section"><b>Choose demo QR</b>'+examples.map(r=>'<p><button class="secondary block" onclick="populate(\''+r.rego+'\')">'+r.fleet+' · '+r.rego+'</button></p>').join("")+'</div>';if(method==="sms")html+='<div class="soft section"><p>Demo broker matching using registration or mobile number.</p><button class="secondary block" onclick="sms()">Simulate verified SMS reply</button></div>';html+=(data.fleet?'<p class="soft"><b>Identified fleet: '+esc(data.fleet)+'</b></p>':"")+field("name","Driver full name")+field("mobile","Mobile number")+field("rego","Vehicle registration")+'<label>Registration state</label>'+tiles("state",["VIC","NSW","QLD","SA","WA","TAS","ACT","NT"])+'<p>'+toggle("confirmed","I confirm these details are correct")+'</p>';break;
case 5:html+='<h1>Photos and notes</h1><p class="muted">Real uploads require a backend. Sample photo counter only.</p><div class="soft"><b>Sample photos: '+data.photos+'</b><p><button class="secondary" onclick="set(\'photos\',data.photos+1)">Add sample photo</button></p></div>'+field("notes","Driver statement","Describe what happened",true);break;
case 6:html+='<h1>Review your report</h1>'+pair("Safety",data.safe)+pair("Injuries",data.injuries)+pair("Police",data.police?"Required":"Not selected")+pair("Fire",data.fire?"Required":"Not selected")+pair("Ambulance",data.ambulance?"Required":"Not selected")+pair("Incident",data.incident)+pair("Location",data.location)+pair("When",data.when)+pair("People involved",data.people)+pair("Driver",data.name)+pair("Mobile",data.mobile)+pair("Registration",data.rego)+pair("Fleet",data.fleet)+pair("Photos",data.photos)+pair("Notes",data.notes);break;
case 7:html+='<h1>Submit to BIIMA</h1><p class="muted">This is a demo. No real server sync or submission is enabled.</p>'+pair("Driver",data.name)+pair("Rego",data.rego)+'<p>'+toggle("consent","I confirm the report is accurate")+'</p><button class="primary block" '+(!data.consent?"disabled":"")+' onclick="submit()">Complete demonstration</button>';break;
}html+=buttons()+'</section>'}
root.innerHTML=html;
}
window.addEventListener("online",()=>{online=true;render()});window.addEventListener("offline",()=>{online=false;render()});render();
</script></body></html>
